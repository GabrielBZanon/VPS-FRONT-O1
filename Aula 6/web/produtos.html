<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto - IPlast</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="footer.css">
    <script src="produtos.js" defer></script>
</head>
<body>
    <header>
        <h1>IPlast</h1>
    </header>
    
    <main>
        <div class="container">
            <h2>Cadastro de Produto</h2>
            <form id="produto-form">
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" name="nome" required>
                
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" name="descricao" required>
                
                <label for="valor-custo">Valor de Custo:</label>
                <input type="number" id="valor-custo" name="valor-custo" step="0.01" required>
                
                <label for="valor-final">Valor Final:</label>
                <input type="number" id="valor-final" name="valor-final" step="0.01" required>
                
                <button type="submit">Cadastrar</button>
            </form>

            <button id="novo-produto-btn">Novo Produto</button> 

            <h3>Produtos Cadastrados:</h3>
            <div id="produtos-lista"></div>
        </div>
    </main>
    
    <footer>
        <p>Desenvolvido por Lucas Paiva</p>
    </footer>
</body>
</html>
